version: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-container
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Mount the Nginx config
    ports:
      - 80:80 # Expose Nginx on port 80
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
