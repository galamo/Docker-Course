version: '3'

services:
  node-api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql
      - rabbitmq

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: your_database
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  rabbitmq:
    image: "rabbitmq:management"
    ports:
      - "15672:15672"  # RabbitMQ management UI (optional)
      - "5672:5672"    # RabbitMQ message broker

  audit:
    build:
      context: ./auditSender
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

  login:
    build:
      context: ./loginFailurePublisher
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
