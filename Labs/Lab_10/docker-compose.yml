version: "3.8"

services:
  node_api_first:
    build: ./node_api_1
    ports:
      - "3000:3000"

  node_api_second:
    build: ./node_api_1
    ports:
      - "3001:3000"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    ports:
      - "443:443"
    depends_on:
      - node_api_second
      - node_api_first
